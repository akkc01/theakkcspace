name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: main-ui
            path: ./main-ui
            image: akkc-main

          - name: support-ui
            path: ./support-ui
            image: akkc-support

          - name: email-ui
            path: ./email-ui
            image: akkc-email

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.path }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}