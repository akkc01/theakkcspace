name: Build Push and Update Helm

on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - name: main-ui
            path: ./main-ui
            image: akkcmain
          - name: support-ui
            path: ./support-ui
            image: akkcsupport
          - name: email-ui
            path: ./email-ui
            image: akkcemail

    steps:

    # Checkout App Repo
    - name: Checkout App Code
      uses: actions/checkout@v4

# Debug (optional but useful)
    - name: Debug Files
      run: ls -R

# Docker Login
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


# Build & Push Images
    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.service.path }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}


# Checkout Helm Repo
    - name: Checkout Helm Repo
      uses: actions/checkout@v4
      with:
        repository: akkc01/theakkcspace-deploy-aks-helm-argocd
        token: ${{ secrets.GH_PAT }}
        path: helm-repo

# Install yq (YAML tool) for updating Helm values.yaml files in a proper way
    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq

# Update Helm values.yaml files with the new image tag
    - name: Update Helm values
      if: matrix.service.name == 'main-ui'
      run: |
        TAG=${{ github.sha }}

        echo "Updating image tag to $TAG"

        yq e -i ".image.tag = \"$TAG\"" helm-repo/theakkcspace-helm/main-chart/values.yaml
        yq e -i ".image.tag = \"$TAG\"" helm-repo/theakkcspace-helm/support-chart/values.yaml
        yq e -i ".image.tag = \"$TAG\"" helm-repo/theakkcspace-helm/email-chart/values.yaml

# Commit & Push Changes
    - name: Commit and Push
      if: matrix.service.name == 'main-ui'
      run: |
        cd helm-repo

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        # Ensure correct branch
        git checkout main
        git pull origin main

        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update image tag to ${{ github.sha }}"
          git push origin main
        fi